apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: microshop-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-secretsmanager,kind: ClusterSecretStore}
  target: {name: microshop-secrets,creationPolicy: Owner}
  dataFrom:
  - extract: {key: {{.Values.secretName}}}

