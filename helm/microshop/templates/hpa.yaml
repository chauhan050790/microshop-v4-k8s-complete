{{- if .Values.hpa.enabled }}{{- range $name,$s := .Values.services }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{$name}}}
spec:
  scaleTargetRef: {apiVersion: apps/v1,kind: Deployment,name: {{$name}}}
  minReplicas: {{$.Values.hpa.min}}
  maxReplicas: {{$.Values.hpa.max}}
  metrics: [{type: Resource,resource: {name: cpu,target: {type: Utilization,averageUtilization: {{$.Values.hpa.cpu}}}}}]
---
{{- end}}{{- end}}

