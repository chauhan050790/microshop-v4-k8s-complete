{{- $releaseTag := required "releaseTag must be supplied as an immutable image tag" .Values.releaseTag -}}
{{- $registry := required "global.registry must be supplied (for example, an ECR registry)" .Values.global.registry -}}
{{- if not (regexMatch "^[0-9a-f]{40}$" $releaseTag) }}{{ fail "releaseTag must be a 40-character lowercase Git SHA" }}{{ end }}
{{- range $name,$s := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: { app: {{ $name }} }
spec:
  replicas: {{ $s.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata: { labels: { app: {{ $name }} } }
    spec:
      serviceAccountName: microshop
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: {{ $name }}
        image: "{{ $registry }}/{{ $s.image }}:{{ $releaseTag }}"
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports: [{ name: http, containerPort: {{ $s.port }} }]
        envFrom:
        - configMapRef: { name: microshop-config }
        - secretRef: { name: microshop-secrets }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
        readinessProbe:
          httpGet: { path: {{ $s.healthPath }}, port: http }
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet: { path: {{ $s.healthPath }}, port: http }
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        startupProbe:
          httpGet: { path: {{ $s.healthPath }}, port: http }
          periodSeconds: 5
          failureThreshold: 30
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: { app: {{ $name }} }
spec:
  type: ClusterIP
  selector: { app: {{ $name }} }
  ports: [{ name: http, port: {{ $s.port }}, targetPort: http }]
---
{{- end }}
