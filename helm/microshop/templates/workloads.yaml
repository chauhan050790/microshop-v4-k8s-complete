{{- range $name,$s := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{$name}},labels: {app: {{$name}}}}
spec:
  replicas: {{$s.replicas}}
  strategy: {type: RollingUpdate,rollingUpdate: {maxUnavailable: 0,maxSurge: 1}}
  selector: {matchLabels: {app: {{$name}}}}
  template:
    metadata: {labels: {app: {{$name}}}}
    spec:
      serviceAccountName: microshop
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: {{$name}}
        image: "{{$.Values.global.registry}}/{{$s.image}}:{{default "REPLACE_RELEASE" $.Values.releaseTag}}"
        imagePullPolicy: {{$.Values.global.imagePullPolicy}}
        ports: [{name: http,containerPort: {{$s.port}}}]
        envFrom: [{secretRef: {name: microshop-secrets}}]
        resources: {requests: {cpu: 100m,memory: 128Mi},limits: {cpu: 500m,memory: 512Mi}}
        readinessProbe: {httpGet: {path: /health,port: http},initialDelaySeconds: 5,periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health,port: http},initialDelaySeconds: 15,periodSeconds: 20}
        securityContext: {allowPrivilegeEscalation: false,readOnlyRootFilesystem: true,capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: {{$name}},labels: {app: {{$name}}}}
spec:
  selector: {app: {{$name}}}
  ports: [{name: http,port: {{$s.port}},targetPort: http}]
---
{{- end}}

