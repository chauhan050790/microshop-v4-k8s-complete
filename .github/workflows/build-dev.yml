name: Build DEV

on:
  push:
    branches:
      - develop

  workflow_dispatch:

# ------------------------------------------------------------
# Permissions
# ------------------------------------------------------------
permissions:
  id-token: write
  contents: write

# ------------------------------------------------------------
# Global Environment
# ------------------------------------------------------------
env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

# ============================================================
# JOBS
# ============================================================
jobs:

  # ==========================================================
  # BUILD ALL SERVICES
  # ==========================================================
  build:

    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      # Do not cancel other services when one service fails
      fail-fast: false

      matrix:
        service:
          - frontend
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:

      # ------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Validate environment
      # ------------------------------------------------------
      - name: Validate image registry and Git SHA
        shell: bash
        run: |
          echo "======================================"
          echo "Service       : ${{ matrix.service }}"
          echo "Git SHA       : $GITHUB_SHA"
          echo "Branch        : $GITHUB_REF"
          echo "AWS Region    : $AWS_REGION"
          echo "ECR Registry  : $ECR_REGISTRY"
          echo "======================================"

          # Validate ECR registry
          test -n "$ECR_REGISTRY"

          # Validate Git SHA
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      # ------------------------------------------------------
      # 3. Check service files
      # ------------------------------------------------------
      - name: Validate service directory
        shell: bash
        run: |
          echo "Checking service directory..."

          test -d "apps/${{ matrix.service }}"

          echo "Files inside apps/${{ matrix.service }}:"
          ls -la "apps/${{ matrix.service }}"

          echo "Checking package.json..."
          test -f "apps/${{ matrix.service }}/package.json"

          echo "Checking package-lock.json..."
          test -f "apps/${{ matrix.service }}/package-lock.json"

          echo "Checking Dockerfile..."
          test -f "apps/${{ matrix.service }}/Dockerfile"

      # ------------------------------------------------------
      # 4. Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.service }}/package-lock.json

      # ------------------------------------------------------
      # 5. Display Node/npm versions
      # ------------------------------------------------------
      - name: Check Node.js and npm versions
        run: |
          node --version
          npm --version

      # ------------------------------------------------------
      # 6. Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          npm ci
        working-directory: apps/${{ matrix.service }}

      # ------------------------------------------------------
      # 7. Run application build
      # ------------------------------------------------------
      - name: Build application
        run: |
          npm run build
        working-directory: apps/${{ matrix.service }}

      # ------------------------------------------------------
      # 8. Configure AWS credentials
      # ------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # 9. Verify AWS identity
      # ------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # 10. Login to Amazon ECR
      # ------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # 11. Setup Docker Buildx
      # ------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # 12. Set image name
      # ------------------------------------------------------
      - name: Set Docker image
        shell: bash
        run: |
          IMAGE_NAME="$ECR_REGISTRY/microshop/${{ matrix.service }}:${GITHUB_SHA}"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

          echo "Docker image:"
          echo "$IMAGE_NAME"

      # ------------------------------------------------------
      # 13. Build Docker image
      # ------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_NAME" \
            "apps/${{ matrix.service }}"

      # ------------------------------------------------------
      # 14. Verify Docker image
      # ------------------------------------------------------
      - name: Verify Docker image
        run: |
          docker images
          docker image inspect "$IMAGE_NAME"

      # ------------------------------------------------------
      # 15. Scan Docker image with Trivy
      # ------------------------------------------------------
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ------------------------------------------------------
      # 16. Push Docker image to ECR
      # ------------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_NAME"

      # ------------------------------------------------------
      # 17. Display pushed image
      # ------------------------------------------------------
      - name: Display image information
        run: |
          echo "======================================"
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "======================================"
          echo "$IMAGE_NAME"
          echo "======================================"

      # ------------------------------------------------------
      # 18. Update DEV GitOps
      #
      # Only ONE matrix job performs GitOps update.
      # notification-service is used as the final matrix job.
      # ------------------------------------------------------
      - name: Update DEV GitOps tag
        if: matrix.service == 'notification-service'
        shell: bash
        run: |

          echo "======================================"
          echo "Updating DEV GitOps"
          echo "======================================"

          echo "ECR Registry:"
          echo "$ECR_REGISTRY"

          echo "Release Tag:"
          echo "$GITHUB_SHA"

          # --------------------------------------------------
          # Update releaseTag
          # --------------------------------------------------
          perl -0pi -e \
            "s/(name:\s*releaseTag\s+value:\s*\")[^\"]+/\1${GITHUB_SHA}/" \
            argocd/application-dev.yaml

          # --------------------------------------------------
          # Update ECR registry
          # --------------------------------------------------
          perl -0pi -e \
            "s/(name:\s*global\.registry\s+value:\s*\")[^\"]+/\1${ECR_REGISTRY}/" \
            argocd/application-dev.yaml

          # --------------------------------------------------
          # Display updated file
          # --------------------------------------------------
          echo "Updated ArgoCD application:"
          cat argocd/application-dev.yaml

          # --------------------------------------------------
          # Git configuration
          # --------------------------------------------------
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------
          # Commit changes
          # --------------------------------------------------
          git add argocd/application-dev.yaml

          if git diff --cached --quiet; then

            echo "No GitOps changes detected."

          else

            git commit \
              -m "release(dev): ${GITHUB_SHA} [skip ci]"

            git push

          fi