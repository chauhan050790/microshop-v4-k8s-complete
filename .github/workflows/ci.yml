name: CI
on: [push,pull_request]
permissions: {contents: read}
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [api-gateway,user-service,product-service,order-service,payment-service,notification-service,frontend]}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: 22}
        cache: npm
        cache-dependency-path: apps/${{matrix.service}}/package-lock.json
    - run: npm ci
      working-directory: apps/${{matrix.service}}
    - run: npm test
      working-directory: apps/${{matrix.service}}
    - run: npm run build
      working-directory: apps/${{matrix.service}}
  infrastructure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with: {terraform_version: 1.15.7}
    - run: terraform fmt -check -recursive infra/terraform
    - run: |
        terraform -chdir=infra/terraform/envs/dev init -backend=false
        terraform -chdir=infra/terraform/envs/dev validate
    - uses: azure/setup-helm@v4
      with: {version: v3.21.0}
    - run: |
        helm lint helm/microshop --values helm/microshop/values-prod.yaml \
          --set global.registry=example.invalid --set releaseTag=0000000000000000000000000000000000000000
        helm template microshop helm/microshop --namespace microshop-prod \
          --values helm/microshop/values-prod.yaml \
          --set global.registry=example.invalid --set releaseTag=0000000000000000000000000000000000000000 > rendered.yaml
        ! grep -E 'REPLACE_|:latest($|["])' rendered.yaml
    - uses: azure/setup-kubectl@v4
    - run: |
        kubectl kustomize k8s/dev >/dev/null
        kubectl kustomize k8s/prod >/dev/null
