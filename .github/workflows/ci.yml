name: CI
on: [push, pull_request]
permissions:
  contents: write
  id-token: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [api-gateway, user-service, product-service, order-service, payment-service, notification-service, frontend]}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/${{ matrix.service }}/package-lock.json
    - run: npm ci
      working-directory: apps/${{ matrix.service }}
    - run: npm test
      working-directory: apps/${{ matrix.service }}
    - run: npm run build
      working-directory: apps/${{ matrix.service }}
  infrastructure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with: {terraform_version: 1.15.7}
    - run: terraform fmt -check -recursive infra/terraform
    - run: |
        terraform -chdir=infra/terraform/envs/dev init -backend=false
        terraform -chdir=infra/terraform/envs/dev validate
    - uses: azure/setup-helm@v4
      with: {version: v3.21.0}
    - run: |
        helm lint helm/microshop --values helm/microshop/values-prod.yaml \
          --set global.registry=example.invalid --set releaseTag=0000000000000000000000000000000000000000
        helm template microshop helm/microshop --namespace microshop-prod \
          --values helm/microshop/values-prod.yaml \
          --set global.registry=example.invalid --set releaseTag=0000000000000000000000000000000000000000 > rendered.yaml
        ! grep -E 'REPLACE_|:latest($|["])' rendered.yaml
    - uses: azure/setup-kubectl@v4
    - run: |
        kubectl kustomize k8s/dev >/dev/null
        kubectl kustomize k8s/prod >/dev/null
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service, payment-service, notification-service, frontend]
    steps:
    - uses: actions/checkout@v4
    - name: Inspect OIDC claims
      shell: bash
      run: |
        token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
        echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub,aud,repository,ref,job_workflow_ref}'
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::185188589391:role/MicroShopGitHubActionsECR
        aws-region: ap-south-1
    - uses: aws-actions/amazon-ecr-login@v2
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: apps/${{ matrix.service }}
        push: true
        tags: 185188589391.dkr.ecr.ap-south-1.amazonaws.com/microshop/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
  update-dev-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Pin DEV images to this commit
      run: |
        sed -i "s/000000000000.dkr.ecr.ap-south-1.amazonaws.com/185188589391.dkr.ecr.ap-south-1.amazonaws.com/g" argocd/application-dev.yaml k8s/dev/kustomization.yaml
        sed -i "s/0000000000000000000000000000000000000000/${GITHUB_SHA}/g" argocd/application-dev.yaml k8s/dev/kustomization.yaml
    - name: Commit DEV GitOps update
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add argocd/application-dev.yaml k8s/dev/kustomization.yaml
        git diff --cached --quiet || git commit -m "Deploy DEV ${GITHUB_SHA} [skip ci]"
        git push