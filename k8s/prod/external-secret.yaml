apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microshop-secrets
  namespace: microshop-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: microshop-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: microshop/prod
