apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microshop-dev
resources:
- ../base
- namespace.yaml
- ingress.yaml
- external-secret.yaml
patches:
- path: patches/replicas.yaml
- path: patches/base-namespace.yaml
- path: patches/serviceaccount.yaml
images:
- name: REPLACE_ECR_REGISTRY/microshop/frontend
  newName: REPLACE_ECR_REGISTRY/microshop/frontend
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/api-gateway
  newName: REPLACE_ECR_REGISTRY/microshop/api-gateway
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/user-service
  newName: REPLACE_ECR_REGISTRY/microshop/user-service
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/product-service
  newName: REPLACE_ECR_REGISTRY/microshop/product-service
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/order-service
  newName: REPLACE_ECR_REGISTRY/microshop/order-service
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/payment-service
  newName: REPLACE_ECR_REGISTRY/microshop/payment-service
  newTag: REPLACE_DEV_TAG
- name: REPLACE_ECR_REGISTRY/microshop/notification-service
  newName: REPLACE_ECR_REGISTRY/microshop/notification-service
  newTag: REPLACE_DEV_TAG

